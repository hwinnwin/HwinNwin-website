services:
  - type: web
    name: hwinwin-marketing
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    env: node
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
    healthCheckPath: /
    numInstances: 1